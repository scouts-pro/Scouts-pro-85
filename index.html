
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Scouts Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              night: {
                900: '#0f172a', // Main background
                800: '#1e293b', // Cards/Sidebar
                700: '#334155', // Borders/Inputs
                100: '#f1f5f9', // Text Primary
                300: '#cbd5e1', // Text Secondary
              },
              primary: {
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              }
            },
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
              mono: ['Cairo', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideIn: {
                '0%': { transform: 'translateX(-20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* إجبار خط Cairo على كل شيء دون استثناء */
      * {
        font-family: 'Cairo', sans-serif !important;
        font-style: normal !important;
        scrollbar-width: thin;
        scrollbar-color: #334155 transparent;
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        background-color: #0f172a;
        color: #f1f5f9;
        font-family: 'Cairo', sans-serif !important;
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* ضمان أن الأرقام والمبالغ المالية المنسقة بـ font-mono تلتزم بـ Cairo */
      .font-mono {
        font-family: 'Cairo', monospace !important;
      }

      /* Custom Scrollbar for Night Mode */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      
      /* Hide scrollbar for cleaner UI in specific areas */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "react-qr-code": "https://esm.sh/react-qr-code@2.0.15"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
